services:
  golang-server:
    build: .
    ports:
      - "50051:50051"
      
    command: ["./main", "--mediadir", "/media", "--loglevel", "info", "--tls-private-key", "/certs/migawka_server.key.pem", "--tls-cert", "/certs/migawka_server.crt"]
    volumes:
      - /home/kuba/migawka_media3:/media
      - /home/kuba/migawka/certs:/certs
    environment:
      - CLIENT_TOKENS=first-secret-token # TODO: should use Docker's secrets
